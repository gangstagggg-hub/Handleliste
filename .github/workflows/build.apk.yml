name: Bygg AAB og APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # Opplastingsnøkkelen for Google Play ligger i GitHub Secrets (se README).
      # Uten Secrets bygges appen med sideload-nøkkelen i stedet.
      - name: Klargjør opplastingsnøkkel
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Bruker opplastingsnøkkel fra Secrets"
          else
            echo "::warning::Ingen UPLOAD_KEYSTORE_BASE64 – bygger med sideload-nøkkel (ikke egnet for Google Play)"
          fi

      - name: Bygg AAB (Google Play) og APK
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Lagre AAB
        uses: actions/upload-artifact@v4
        with:
          name: Handleliste-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Lagre APK
        uses: actions/upload-artifact@v4
        with:
          name: Handleliste-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Legg filene ut under Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Handleliste.apk
          cp app/build/outputs/bundle/release/app-release.aab Handleliste.aab
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Handleliste.apk Handleliste.aab \
            --title "Handleliste (bygg ${{ github.run_number }})" \
            --notes "Handleliste.aab lastes opp i Google Play Console. Handleliste.apk kan installeres direkte på Android." \
            --latest
