<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Handleliste</title>
<meta name="theme-color" content="#2c4f49" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Handleliste" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e6;
    --surface: #fffdf8;
    --ink: #22322e;
    --muted: #7c7568;
    --line: #e6ddc9;
    --teal: #2c4f49;
    --teal-light: #3f7068;
    --gold: #c8992e;
    --gold-soft: #e9c877;
    --brick: #a8452f;
    --cream: #f6f1e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 40px rgba(44,79,73,0.08);
  }

  /* HEADER */
  header {
    background: var(--teal);
    color: var(--cream);
    padding: 28px 24px 22px;
    text-align: center;
    position: relative;
  }
  header .logo {
    width: 40px;
    height: 40px;
    margin: 0 auto 10px;
    display: block;
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.6rem;
    letter-spacing: 0.02em;
    margin: 0;
  }
  header .sub {
    font-size: 12px;
    color: #cfe0da;
    margin-top: 4px;
    letter-spacing: 0.03em;
  }

  .page { flex: 1; display: flex; flex-direction: column; padding: 0 24px; }

  /* INPUT ROW */
  .row { display: flex; gap: 10px; padding-top: 22px; }
  input[type=text] {
    flex: 1;
    padding: 13px 16px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    outline: none;
    font-size: 16px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    transition: border-color 0.2s;
  }
  input[type=text]:focus { border-color: var(--teal-light); }

  button {
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    border: none;
    border-radius: 12px;
    letter-spacing: 0.01em;
  }
  button.gold { background: var(--gold); color: var(--teal); padding: 13px 20px; }
  button.gold:active { background: var(--gold-soft); }
  button.outline-teal {
    background: transparent;
    color: var(--teal);
    border: 1.5px solid var(--teal);
    padding: 12px 16px;
  }
  button.outline-brick {
    background: transparent;
    color: var(--brick);
    border: 1.5px solid var(--brick);
    padding: 12px 16px;
  }
  button.solid-teal { background: var(--teal); color: var(--cream); padding: 13px 20px; }
  button.plain { background: none; color: var(--muted); font-size: 12px; font-weight: 500; padding: 4px 6px; }

  /* LIST */
  ul, ol { list-style: none; margin: 18px 0 0; padding: 0; flex: 1; overflow-y: auto; }
  li.item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 2px;
    border-bottom: 1px solid var(--line);
    user-select: none;
  }
  .item-text {
    font-family: 'Fraunces', serif;
    font-size: 1.25rem;
    font-weight: 400;
    display: inline-block;
    position: relative;
    color: var(--ink);
  }
  .item-text.checked {
    color: var(--muted);
  }
  .item-text.checked::after {
    content: "";
    position: absolute;
    left: -2%;
    width: 104%;
    top: 52%;
    height: 1.5px;
    background: var(--gold);
  }
  .empty { text-align: center; color: var(--muted); margin-top: 40px; font-size: 14px; font-family: 'Inter', sans-serif; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; padding: 10px 0 4px; }
  .swipe-hint { font-size: 12px; color: var(--muted); text-align: center; margin: 18px 0 4px; }

  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px 0 10px; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(34,50,46,0.55);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    z-index: 10;
  }
  .modal { background: var(--surface); max-width: 340px; width: 100%; border-radius: 18px; padding: 26px 24px; }
  .modal p { font-family: 'Fraunces', serif; font-size: 1.2rem; margin: 0 0 20px; color: var(--ink); }
  .modal .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .hidden { display: none !important; }

  .top-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4px; border-bottom: 1px solid var(--line);
    cursor: grab; transition: background 0.35s ease;
    border-radius: 8px;
  }
  .top-row.flash { background: rgba(200,153,46,0.14); }
  .top-row .rank { color: var(--gold); margin-right: 10px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; }
  .top-row .count { font-size: 12px; color: var(--teal-light); font-family: 'Inter', sans-serif; font-weight: 500; }

  .footer-btn { padding: 20px 0; }

  .install-banner {
    position: sticky; bottom: 0; left: 0; right: 0;
    background: var(--teal); color: var(--cream);
    padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; font-size: 12px; z-index: 20;
  }
  .install-banner span { flex: 1; line-height: 1.5; }
  .install-banner .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .install-banner button { padding: 9px 12px; font-size: 11px; border-radius: 10px; }
  .install-banner button.install-yes { background: var(--gold); color: var(--teal); }
  .install-banner button.install-no { background: none; border: 1px solid rgba(246,241,230,0.5); color: var(--cream); }

  .manual-install {
    text-align: center; padding-bottom: 18px;
  }
  .manual-install button {
    font-size: 12px; color: var(--muted); background: none; border: none;
    text-decoration: underline; text-underline-offset: 3px;
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <svg class="logo" viewBox="0 0 100 100" fill="none">
      <path d="M30 38 L38 20 M70 38 L62 20" stroke="#f6f1e6" stroke-width="5" stroke-linecap="round"/>
      <path d="M26 38 L74 38 L68 78 L32 78 Z" stroke="#f6f1e6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M40 56 L48 64 L64 46" stroke="#c8992e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Handleliste</h1>
    <div class="sub" id="subtitle">0 varer igjen</div>
  </header>

  <!-- SIDE: LISTE -->
  <div class="page" id="page-liste">
    <div class="row">
      <input type="text" id="itemInput" placeholder="Legg til vare..." autofocus />
      <button class="gold" id="addBtn">Legg til</button>
    </div>
    <ul id="itemList"></ul>
    <div class="hint">Dobbeltrykk en vare for å streke den over.</div>
    <div class="btn-grid">
      <button class="outline-brick" id="resetBtn">Nullstill</button>
      <button class="outline-teal" id="top15Btn">Topp 15</button>
    </div>
  </div>

  <!-- SIDE: TOPP 15 -->
  <div class="page hidden" id="page-top15">
    <div class="swipe-hint">Sveip en vare mot høyre for å legge den til på handlelisten.</div>
    <ol id="topList"></ol>
    <div class="footer-btn">
      <button class="solid-teal" style="width:100%;" id="backFromTop">Tilbake til listen</button>
    </div>
  </div>

  <!-- MODAL: BEKREFT NULLSTILL -->
  <div class="modal-backdrop hidden" id="confirmModal">
    <div class="modal">
      <p>Er du sikker på at du vil slette hele listen?</p>
      <div class="btn-row">
        <button class="outline-teal" id="cancelReset">Avbryt</button>
        <button class="outline-brick" id="confirmReset" style="background:var(--brick);color:var(--cream);border-color:var(--brick);">Slett</button>
      </div>
    </div>
  </div>

  <div class="install-banner hidden" id="installBanner">
    <span id="installText">Installer Handleliste som app på telefonen din?</span>
    <div class="actions">
      <button class="install-yes" id="installBtn">Installer</button>
      <button class="install-no" id="installDismiss">Ikke nå</button>
    </div>
  </div>

</div>

<script>
(function () {
  const KEY_ITEMS = "handleliste-items";
  const KEY_FREQ = "handleliste-frekvens";

  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  let items = load(KEY_ITEMS, []);
  let freq = load(KEY_FREQ, {});

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  const pages = {
    liste: document.getElementById("page-liste"),
    top15: document.getElementById("page-top15"),
  };
  const subtitle = document.getElementById("subtitle");

  function showPage(name) {
    Object.values(pages).forEach((p) => p.classList.add("hidden"));
    pages[name].classList.remove("hidden");
    if (name === "liste") renderItems();
    if (name === "top15") renderTop15();
    updateSubtitle(name);
  }

  function updateSubtitle(name) {
    if (name === "liste") {
      const active = items.filter((i) => !i.checked).length;
      subtitle.textContent = `${active} varer igjen`;
    } else {
      subtitle.textContent = "Topp 15 mest kjøpte";
    }
  }

  function capitalize(str) {
    if (!str) return str;
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  function addItem(name) {
    const trimmed = capitalize(name.trim());
    if (!trimmed) return;
    items.push({ id: uid(), name: trimmed, checked: false });
    freq[trimmed] = (freq[trimmed] || 0) + 1;
    save(KEY_ITEMS, items);
    save(KEY_FREQ, freq);
    renderItems();
  }

  function removeItem(id) {
    items = items.filter((it) => it.id !== id);
    save(KEY_ITEMS, items);
    renderItems();
  }

  function toggleChecked(id) {
    items = items.map((it) => (it.id === id ? { ...it, checked: !it.checked } : it));
    save(KEY_ITEMS, items);
    renderItems();
  }

  let lastTap = {};
  function handleItemTap(id) {
    const now = Date.now();
    const last = lastTap[id] || 0;
    if (now - last < 350) {
      toggleChecked(id);
      lastTap[id] = 0;
    } else {
      lastTap[id] = now;
    }
  }

  function renderItems() {
    const ul = document.getElementById("itemList");
    ul.innerHTML = "";
    if (items.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Listen er tom. Skriv inn en vare over.";
      ul.appendChild(li);
    } else {
      items.forEach((it) => {
        const li = document.createElement("li");
        li.className = "item";
        const span = document.createElement("span");
        span.className = "item-text" + (it.checked ? " checked" : "");
        span.textContent = it.name;
        span.addEventListener("click", () => handleItemTap(it.id));
        const btn = document.createElement("button");
        btn.className = "plain";
        btn.textContent = "fjern";
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          removeItem(it.id);
        });
        li.appendChild(span);
        li.appendChild(btn);
        ul.appendChild(li);
      });
    }
    updateSubtitle("liste");
  }

  function getTop15() {
    return Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 15);
  }

  let swipeStartX = {};
  function onSwipeStart(name, e) {
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    swipeStartX[name] = x;
  }
  function onSwipeEnd(name, rowEl, e) {
    const startX = swipeStartX[name];
    if (startX == null) return;
    const x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
    const delta = x - startX;
    swipeStartX[name] = null;
    if (delta > 60) {
      addItem(name);
      rowEl.classList.add("flash");
      const countEl = rowEl.querySelector(".count");
      const original = countEl.textContent;
      countEl.textContent = "lagt til ✓";
      setTimeout(() => {
        rowEl.classList.remove("flash");
        countEl.textContent = original;
      }, 500);
    }
  }

  function renderTop15() {
    const ol = document.getElementById("topList");
    ol.innerHTML = "";
    const top = getTop15();
    if (top.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Ingen statistikk ennå. Legg til varer på listen først.";
      ol.appendChild(li);
      return;
    }
    top.forEach(([name, count], idx) => {
      const li = document.createElement("li");
      li.className = "top-row";
      li.innerHTML = `<span class="item-text"><span class="rank">${idx + 1}</span>${name}</span><span class="count">${count}x</span>`;
      li.addEventListener("touchstart", (e) => onSwipeStart(name, e), { passive: true });
      li.addEventListener("touchend", (e) => onSwipeEnd(name, li, e));
      li.addEventListener("mousedown", (e) => onSwipeStart(name, e));
      li.addEventListener("mouseup", (e) => onSwipeEnd(name, li, e));
      ol.appendChild(li);
    });
  }

  const itemInput = document.getElementById("itemInput");
  document.getElementById("addBtn").addEventListener("click", () => {
    addItem(itemInput.value);
    itemInput.value = "";
  });
  itemInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      addItem(itemInput.value);
      itemInput.value = "";
    }
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    document.getElementById("confirmModal").classList.remove("hidden");
  });
  document.getElementById("cancelReset").addEventListener("click", () => {
    document.getElementById("confirmModal").classList.add("hidden");
  });
  document.getElementById("confirmReset").addEventListener("click", () => {
    items = [];
    save(KEY_ITEMS, items);
    document.getElementById("confirmModal").classList.add("hidden");
    renderItems();
  });

  document.getElementById("top15Btn").addEventListener("click", () => showPage("top15"));
  document.getElementById("backFromTop").addEventListener("click", () => showPage("liste"));

  showPage("liste");

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  const installBanner = document.getElementById("installBanner");
  const installText = document.getElementById("installText");
  const installBtn = document.getElementById("installBtn");
  const installDismiss = document.getElementById("installDismiss");

  const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;
  const ua = navigator.userAgent.toLowerCase();
  const isIOS = /iphone|ipad|ipod/.test(ua);

  let deferredPrompt = null;

  function showInstallBanner(mode) {
    if (isStandalone) return;
    if (mode === "ios") {
      installText.textContent =
        "Legg til Handleliste på hjem-skjermen: trykk Del-ikonet nederst, og velg \"Legg til på Hjem-skjerm\".";
      installBtn.classList.add("hidden");
    } else {
      installText.textContent = "Installer Handleliste som app på telefonen din?";
      installBtn.classList.remove("hidden");
    }
    installBanner.classList.remove("hidden");
  }

  if (!isStandalone) {
    if (isIOS) {
      setTimeout(() => showInstallBanner("ios"), 500);
    } else {
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showInstallBanner("android");
      });
    }
  }

  installBtn.addEventListener("click", async () => {
    installBanner.classList.add("hidden");
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    }
  });

  installDismiss.addEventListener("click", () => {
    installBanner.classList.add("hidden");
  });

  window.addEventListener("appinstalled", () => {
    installBanner.classList.add("hidden");
  });
})();
</script>
</body>
</html>
