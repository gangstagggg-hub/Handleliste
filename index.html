<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Handleliste</title>
<meta name="theme-color" content="#3f7068" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Handleliste" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4efe0;
    --ink: #2e2a24;
    --graphite: #5a564c;
    --faint: #d9d0b4;
    --teal: #3f7068;
    --mustard: #cf9d2e;
    --plum: #7a4e6d;
    --brick: #a8452f;
    --cream: #fbf8ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    background-image:
      linear-gradient(var(--faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--faint) 1px, transparent 1px);
    background-size: 22px 22px;
    font-family: 'Space Mono', monospace;
    color: var(--ink);
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: var(--cream);
    box-shadow: 0 0 0 3px var(--ink);
    display: flex;
    flex-direction: column;
  }
  .checker {
    width: 100%;
    border-top: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
  }
  header {
    padding: 16px 20px 12px;
    text-align: center;
  }
  header h1 {
    font-family: 'Patrick Hand', cursive;
    font-weight: 400;
    font-size: 1.8rem;
    margin: 0;
  }
  header .sub {
    font-size: 12px;
    color: var(--graphite);
    margin-top: 2px;
  }
  .page { flex: 1; display: flex; flex-direction: column; padding: 0 20px; }
  .row { display: flex; gap: 8px; padding-top: 16px; }
  input[type=text] {
    flex: 1;
    padding: 8px 12px;
    background: var(--paper);
    border: 2px solid var(--ink);
    outline: none;
    font-size: 16px;
    font-family: 'Space Mono', monospace;
    color: var(--ink);
  }
  button {
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: 13px;
    border: 2px solid var(--ink);
    border-radius: 3px;
    color: var(--cream);
    padding: 10px 16px;
  }
  button.plain { background: none; border: none; color: var(--brick); font-size: 11px; padding: 4px 8px; }
  button.teal { background: var(--teal); }
  button.brick { background: var(--brick); }
  button.plum { background: var(--plum); }
  button.outline { background: var(--paper); color: var(--ink); }
  ul, ol { list-style: none; margin: 12px 0 0; padding: 0; flex: 1; overflow-y: auto; }
  li.item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px dashed var(--faint);
    user-select: none;
  }
  .item-text {
    font-family: 'Patrick Hand', cursive;
    font-size: 1.5rem;
    display: inline-block;
    position: relative;
  }
  .item-text.checked { color: var(--graphite); opacity: 0.85; }
  .item-text.checked::before,
  .item-text.checked::after {
    content: "";
    position: absolute;
    left: -3%;
    width: 106%;
    height: 4px;
    background: var(--graphite);
    border-radius: 3px;
    mix-blend-mode: multiply;
  }
  .item-text.checked::before { top: 44%; transform: rotate(-1.8deg); opacity: 0.85; }
  .item-text.checked::after { top: 56%; transform: rotate(1.4deg); opacity: 0.7; }
  .empty { text-align: center; color: var(--graphite); margin-top: 32px; font-size: 14px; }
  .hint { font-size: 11px; color: var(--graphite); text-align: center; padding: 4px 0 8px; }
  .swipe-hint { font-size: 12px; color: var(--graphite); text-align: center; margin-bottom: 4px; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px 0; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    z-index: 10;
  }
  .modal { background: var(--cream); max-width: 340px; width: 100%; border: 3px solid var(--ink); }
  .modal .body { padding: 20px; }
  .modal p { font-family: 'Patrick Hand', cursive; font-size: 1.2rem; margin: 0 0 16px; }
  .modal .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hidden { display: none !important; }
  .top-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 4px; border-bottom: 1px dashed var(--faint); cursor: grab; transition: background 0.3s ease; }
  .top-row.flash { background: rgba(63, 112, 104, 0.13); }
  .top-row .rank { color: var(--graphite); margin-right: 8px; font-family: 'Space Mono', monospace; font-size: 13px; }
  .top-row .count { font-size: 12px; color: #2c4f49; font-family: 'Space Mono', monospace; }
  .footer-btn { padding: 16px 0; }
</style>
</head>
<body>
<div id="app">

  <div class="checker" id="checker1" style="height:10px;"></div>

  <header>
    <h1>&#9998; Handleliste</h1>
    <div class="sub" id="subtitle">0 varer igjen</div>
  </header>

  <div class="checker" id="checker2" style="height:8px;"></div>

  <!-- SIDE: LISTE -->
  <div class="page" id="page-liste">
    <div class="row">
      <input type="text" id="itemInput" placeholder="Legg til vare..." autofocus />
      <button class="teal" id="addBtn">Legg til</button>
    </div>
    <ul id="itemList"></ul>
    <div class="hint">Dobbeltrykk en vare for å streke den over.</div>
    <div class="checker" style="height:8px;" id="checker3"></div>
    <div class="btn-grid">
      <button class="brick" id="resetBtn">Nullstill</button>
      <button class="plum" id="top15Btn">Topp 15</button>
    </div>
  </div>

  <!-- SIDE: TOPP 15 -->
  <div class="page hidden" id="page-top15">
    <div class="swipe-hint">Sveip en vare mot høyre for å legge den til på handlelisten.</div>
    <ol id="topList"></ol>
    <div class="footer-btn">
      <div class="checker" style="height:8px;"></div>
      <button class="teal" style="width:100%;margin-top:16px;" id="backFromTop">Tilbake til listen</button>
    </div>
  </div>

  <!-- MODAL: BEKREFT NULLSTILL -->
  <div class="modal-backdrop hidden" id="confirmModal">
    <div class="modal">
      <div class="checker" style="height:8px;"></div>
      <div class="body">
        <p>Er du sikker på at du vil slette hele listen?</p>
        <div class="btn-row">
          <button class="outline" id="cancelReset">Avbryt</button>
          <button class="brick" id="confirmReset">Slett</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  const KEY_ITEMS = "handleliste-items";
  const KEY_FREQ = "handleliste-frekvens";

  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      console.error("Kunne ikke laste", key, e);
      return fallback;
    }
  }
  function save(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      console.error("Kunne ikke lagre", key, e);
    }
  }

  let items = load(KEY_ITEMS, []);       // [{id, name, checked}]
  let freq = load(KEY_FREQ, {});         // { name: count }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function paintChecker(el, colorA, colorB, size) {
    el.style.backgroundImage = `repeating-conic-gradient(${colorA} 0% 25%, ${colorB} 0% 50%)`;
    el.style.backgroundSize = `${size}px ${size}px`;
  }
  document.querySelectorAll(".checker").forEach((el, i) => {
    const pairs = [["#3f7068", "#cf9d2e"], ["#7a4e6d", "#cf9d2e"], ["#3f7068", "#7a4e6d"]];
    const [a, b] = pairs[i % pairs.length];
    paintChecker(el, a, b, parseInt(el.style.height) || 8);
  });

  const pages = {
    liste: document.getElementById("page-liste"),
    top15: document.getElementById("page-top15"),
  };
  const subtitle = document.getElementById("subtitle");

  function showPage(name) {
    Object.values(pages).forEach((p) => p.classList.add("hidden"));
    pages[name].classList.remove("hidden");
    if (name === "liste") renderItems();
    if (name === "top15") renderTop15();
    updateSubtitle(name);
  }

  function updateSubtitle(name) {
    if (name === "liste") {
      const active = items.filter((i) => !i.checked).length;
      subtitle.textContent = `${active} varer igjen`;
    } else {
      subtitle.textContent = "Topp 15 mest kjøpte";
    }
  }

  function addItem(name) {
    const trimmed = name.trim();
    if (!trimmed) return;
    items.push({ id: uid(), name: trimmed, checked: false });
    freq[trimmed] = (freq[trimmed] || 0) + 1;
    save(KEY_ITEMS, items);
    save(KEY_FREQ, freq);
    renderItems();
  }

  function removeItem(id) {
    items = items.filter((it) => it.id !== id);
    save(KEY_ITEMS, items);
    renderItems();
  }

  function toggleChecked(id) {
    items = items.map((it) => (it.id === id ? { ...it, checked: !it.checked } : it));
    save(KEY_ITEMS, items);
    renderItems();
  }

  let lastTap = {};
  function handleItemTap(id) {
    const now = Date.now();
    const last = lastTap[id] || 0;
    if (now - last < 350) {
      toggleChecked(id);
      lastTap[id] = 0;
    } else {
      lastTap[id] = now;
    }
  }

  function renderItems() {
    const ul = document.getElementById("itemList");
    ul.innerHTML = "";
    if (items.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Listen er tom. Skriv inn en vare over.";
      ul.appendChild(li);
    } else {
      items.forEach((it) => {
        const li = document.createElement("li");
        li.className = "item";
        const span = document.createElement("span");
        span.className = "item-text" + (it.checked ? " checked" : "");
        span.textContent = it.name;
        span.addEventListener("click", () => handleItemTap(it.id));
        const btn = document.createElement("button");
        btn.className = "plain";
        btn.textContent = "fjern";
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          removeItem(it.id);
        });
        li.appendChild(span);
        li.appendChild(btn);
        ul.appendChild(li);
      });
    }
    updateSubtitle("liste");
  }

  function getTop15() {
    return Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 15);
  }

  // Sveip til høyre på en topp15-vare -> legg til i handlelisten
  let swipeStartX = {};
  function onSwipeStart(name, e) {
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    swipeStartX[name] = x;
  }
  function onSwipeEnd(name, rowEl, e) {
    const startX = swipeStartX[name];
    if (startX == null) return;
    const x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
    const delta = x - startX;
    swipeStartX[name] = null;
    if (delta > 60) {
      addItem(name);
      rowEl.classList.add("flash");
      const countEl = rowEl.querySelector(".count");
      const original = countEl.textContent;
      countEl.textContent = "lagt til ✓";
      setTimeout(() => {
        rowEl.classList.remove("flash");
        countEl.textContent = original;
      }, 500);
    }
  }

  function renderTop15() {
    const ol = document.getElementById("topList");
    ol.innerHTML = "";
    const top = getTop15();
    if (top.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Ingen statistikk ennå. Legg til varer på listen først.";
      ol.appendChild(li);
      return;
    }
    top.forEach(([name, count], idx) => {
      const li = document.createElement("li");
      li.className = "top-row";
      li.innerHTML = `<span class="item-text"><span class="rank">${idx + 1}.</span>${name}</span><span class="count">${count}x</span>`;
      li.addEventListener("touchstart", (e) => onSwipeStart(name, e), { passive: true });
      li.addEventListener("touchend", (e) => onSwipeEnd(name, li, e));
      li.addEventListener("mousedown", (e) => onSwipeStart(name, e));
      li.addEventListener("mouseup", (e) => onSwipeEnd(name, li, e));
      ol.appendChild(li);
    });
  }

  // --- Events: hovedside ---
  const itemInput = document.getElementById("itemInput");
  document.getElementById("addBtn").addEventListener("click", () => {
    addItem(itemInput.value);
    itemInput.value = "";
  });
  itemInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      addItem(itemInput.value);
      itemInput.value = "";
    }
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    document.getElementById("confirmModal").classList.remove("hidden");
  });
  document.getElementById("cancelReset").addEventListener("click", () => {
    document.getElementById("confirmModal").classList.add("hidden");
  });
  document.getElementById("confirmReset").addEventListener("click", () => {
    items = [];
    save(KEY_ITEMS, items);
    document.getElementById("confirmModal").classList.add("hidden");
    renderItems();
  });

  document.getElementById("top15Btn").addEventListener("click", () => showPage("top15"));
  document.getElementById("backFromTop").addEventListener("click", () => showPage("liste"));

  // Init
  showPage("liste");

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((e) => console.error("SW-feil", e));
    });
  }
})();
</script>
</body>
</html>
